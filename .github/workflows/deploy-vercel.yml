# Deploy AscendOS on Vercel Hobby (front + /api/aggregate) — free
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Docs: docs/FREE_HOSTING.md

name: Deploy Vercel

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "shared/**"
      - "vercel.json"
      - "index.html"
      - "app.html"
      - "assets/**"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel non déployé — secrets manquants. Ajoute VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (voir docs/FREE_HOSTING.md), puis Actions → Deploy Vercel → Run workflow."
            {
              echo "## Vercel · skipped"
              echo "Secrets requis : \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, \`VERCEL_PROJECT_ID\`"
              echo "Une fois : \`npx vercel login\` puis \`npx vercel link\` → copier orgId/projectId depuis \`.vercel/project.json\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production
        if: steps.check.outputs.skip == 'false'
        run: |
          npm i -g vercel@39
          url=$(vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" | tee /dev/stderr | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Vercel · deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Dans AscendOS → Connecteurs → URL API agrégateur : \`${url%/}/api\` (ou l’origine du projet)." >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        id: vercel_deploy
