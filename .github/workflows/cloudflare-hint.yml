# AscendOS on Cloudflare Pages + Worker
# Free: https://developers.cloudflare.com/workers/platform/pricing/

name: Deploy Cloudflare Pages (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy instructions
        run: |
          echo "Install wrangler locally, then:"
          echo "  npx wrangler login"
          echo "  npx wrangler deploy          # Worker /aggregate"
          echo "  npx wrangler pages deploy . --project-name=ascendos"
          echo "See docs/FREE_HOSTING.md"
