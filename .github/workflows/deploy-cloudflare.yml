# Deploy Cloudflare Worker (aggregate API) — free tier
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Docs: docs/FREE_HOSTING.md

name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, master]
    paths:
      - "workers/**"
      - "shared/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # package-lock may be absent on first clone; cache optional
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install wrangler
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Ajoute CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (Settings → Secrets) puis relance."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.check.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm
