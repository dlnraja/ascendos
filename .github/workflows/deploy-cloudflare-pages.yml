# Deploy static front to Cloudflare Pages (free) — optional alongside Worker
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional secret: CF_PAGES_PROJECT (default: ascendos)

name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "app.html"
      - "paths.html"
      - "assets/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID requis."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Pages
        if: steps.check.outputs.skip == 'false'
        env:
          PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=ascendos
          packageManager: npm
